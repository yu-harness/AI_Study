<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-labelledby="headflow-title headflow-desc">
<title id="headflow-title">一个头的四步计算</title>
<desc id="headflow-desc">Q 与 K 相乘得到打分表，除以根号 d_k 并加上掩码，按行 softmax 得到权重，再乘 V 得到这个头的输出。</desc>
<defs>
<marker id="headflow-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L8 5 L1 9" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="340" fill="#2d3142"/>
<g font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="30" y="36" width="90" height="32" rx="4" fill="#2A3844" stroke="#7FA3C0" stroke-width="1"/>
<text x="64" y="58" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="15" fill="#f5f5f5">Q</text>
<text x="76" y="63" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="10" fill="#f5f5f5">i</text>
<rect x="130" y="36" width="90" height="32" rx="4" fill="#2A3844" stroke="#7FA3C0" stroke-width="1"/>
<text x="164" y="58" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="15" fill="#f5f5f5">K</text>
<text x="176" y="63" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="10" fill="#f5f5f5">i</text>
<path d="M75 70 L75 136" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#headflow-arrow)"/>
<path d="M175 70 L175 136" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#headflow-arrow)"/>
<rect x="40" y="140" width="140" height="64" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="58" y="171" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="17" fill="#f5f5f5">Q</text>
<text x="71" y="177" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="11" fill="#f5f5f5">i</text>
<text x="82" y="171" font-family="Georgia,'Cambria Math',serif" font-size="17" fill="#f5f5f5">K</text>
<text x="95" y="177" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="11" fill="#f5f5f5">i</text>
<text x="105" y="161" font-family="Georgia,'Cambria Math',serif" font-size="11" fill="#f5f5f5">T</text>
<text x="110" y="192" text-anchor="middle" font-size="12" fill="#949eb2">打分表 L × L</text>
<path d="M184 172 L196 172" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#headflow-arrow)"/>
<rect x="200" y="140" width="140" height="64" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="212" y="171" font-size="16" fill="#f5f5f5">÷</text>
<path d="M226 167 L232 172 L239 153 L258 153" fill="none" stroke="#f5f5f5" stroke-width="1.3" stroke-linejoin="round"/>
<text x="242" y="171" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="15" fill="#f5f5f5">d</text>
<text x="253" y="176" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="10" fill="#f5f5f5">k</text>
<text x="268" y="171" font-size="16" fill="#f5f5f5">+</text>
<text x="286" y="171" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="16" fill="#f5f5f5">M</text>
<text x="270" y="192" text-anchor="middle" font-size="12" fill="#949eb2">缩放，遮住未来</text>
<path d="M344 172 L356 172" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#headflow-arrow)"/>
<rect x="360" y="140" width="140" height="64" rx="6" fill="#403A44" stroke="#f08a59" stroke-width="1"/>
<text x="430" y="170" text-anchor="middle" font-family="Georgia,'Cambria Math',serif" font-size="15" fill="#f08a59">softmax</text>
<text x="430" y="192" text-anchor="middle" font-size="12" fill="#949eb2">每行加起来是 1</text>
<path d="M504 172 L516 172" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#headflow-arrow)"/>
<rect x="520" y="140" width="140" height="64" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="552" y="171" font-size="16" fill="#f5f5f5">×</text>
<text x="572" y="171" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="17" fill="#f5f5f5">V</text>
<text x="585" y="177" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="11" fill="#f5f5f5">i</text>
<text x="590" y="192" text-anchor="middle" font-size="12" fill="#949eb2">输出 L × d_k</text>
<rect x="540" y="236" width="100" height="32" rx="4" fill="#2C3A33" stroke="#86B39A" stroke-width="1"/>
<text x="574" y="258" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="15" fill="#f5f5f5">V</text>
<text x="587" y="263" font-family="Georgia,'Cambria Math',serif" font-style="italic" font-size="10" fill="#f5f5f5">i</text>
<path d="M590 232 L590 208" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#headflow-arrow)"/>
<text x="110" y="236" text-anchor="middle" font-size="12" fill="#949eb2">L = seq_len</text>
<text x="270" y="236" text-anchor="middle" font-size="12" fill="#949eb2">形状不变</text>
<text x="430" y="236" text-anchor="middle" font-size="12" fill="#949eb2">形状不变</text>
<text x="24" y="300" font-size="12" fill="#949eb2">前三步都在这张 L × L 的表上做，最后一步才把权重用回 V：第 t 行权重乘上所有 V，得到第 t 个 token 的新向量。</text>
<text x="24" y="322" font-size="12" fill="#949eb2">每个头都这么跑一遍，头与头之间不共享参数，各看各的关系。</text>
</g>
</svg>
