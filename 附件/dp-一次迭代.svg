<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="dpiter-title dpiter-desc">
<title id="dpiter-title">DP 的一次迭代：数据分给各卡，再走三段通信</title>
<desc id="dpiter-desc">训练数据切成 M 份，每张卡拿一份；四张卡各自算完梯度后，汇总到 0 号卡更新，再把参数广播回其余卡。</desc>
<defs>
<marker id="dpiter-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L8 5 L1 9" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="300" fill="#2d3142"/>
<path d="M360 64 L360 80" fill="none" stroke="#bfc0c0" stroke-width="1"/>
<path d="M110 80 L590 80" fill="none" stroke="#bfc0c0" stroke-width="1"/>
<path d="M110 80 L110 110" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpiter-arrow)"/>
<path d="M270 80 L270 110" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpiter-arrow)"/>
<path d="M430 80 L430 110" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpiter-arrow)"/>
<path d="M590 80 L590 110" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpiter-arrow)"/>
<path d="M350 172 L350 190 L110 190 L110 204" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpiter-arrow)"/>
<path d="M184 236 L200 236" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpiter-arrow)"/>
<path d="M348 236 L364 236" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpiter-arrow)"/>
<rect x="300" y="20" width="120" height="44" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="360" y="40" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">训练数据</text>
<text x="360" y="56" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">切成 M 份</text>
<rect x="40" y="114" width="140" height="56" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="110" y="138" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">卡 1</text>
<text x="110" y="156" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">数据 1</text>
<rect x="200" y="114" width="140" height="56" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="270" y="138" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">卡 2</text>
<text x="270" y="156" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">数据 2</text>
<rect x="360" y="114" width="140" height="56" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="430" y="138" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">卡 3</text>
<text x="430" y="156" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">数据 3</text>
<rect x="520" y="114" width="140" height="56" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="590" y="138" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">卡 M</text>
<text x="590" y="156" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">数据 M</text>
<rect x="40" y="208" width="140" height="56" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="110" y="232" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">梯度汇总</text>
<text x="110" y="250" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">全传到 0 号卡</text>
<rect x="204" y="208" width="140" height="56" rx="6" fill="#403A44" stroke="#f08a59" stroke-width="1"/>
<text x="274" y="232" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f08a59">0 号卡更新</text>
<text x="274" y="250" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">只在这一处更新</text>
<rect x="368" y="208" width="140" height="56" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="438" y="232" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">参数广播</text>
<text x="438" y="250" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">回传其余各卡</text>
<text x="660" y="228" text-anchor="end" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">汇总与广播</text>
<text x="660" y="246" text-anchor="end" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">各 (M−1)N</text>
<text x="24" y="288" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">上排是设备，各拿一份数据各算一份梯度；下排是时序，三笔流量都经过 0 号卡，合计 2(M−1)N。</text>
</svg>
