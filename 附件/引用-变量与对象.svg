<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="100%" role="img" aria-labelledby="refobj-title refobj-desc">
<title id="refobj-title">变量、引用与对象的关系</title>
<desc id="refobj-desc">变量 a 只是一个名字，它存的是对象的地址；箭头表示引用，指向存着 python 的那个字符串对象。</desc>
<defs>
<marker id="refobj-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M1 1 L8 5 L1 9" fill="none" stroke="#f08a59" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="230" fill="#2d3142"/>
<g font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<text x="110" y="60" text-anchor="middle" font-size="12" fill="#949eb2">变量名</text>
<text x="330" y="60" text-anchor="middle" font-size="12" fill="#949eb2">引用（指针）</text>
<text x="580" y="60" text-anchor="middle" font-size="12" fill="#949eb2">对象</text>
<rect x="50" y="84" width="120" height="64" rx="6" fill="#2A3844" stroke="#7FA3C0" stroke-width="1"/>
<text x="110" y="124" text-anchor="middle" font-size="20" font-weight="600" fill="#f5f5f5">a</text>
<path d="M178 116 L492 116" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#refobj-arrow)"/>
<rect x="500" y="84" width="160" height="64" rx="6" fill="#2C3A33" stroke="#86B39A" stroke-width="1"/>
<text x="580" y="112" text-anchor="middle" font-size="14" font-weight="500" fill="#f5f5f5">"python"</text>
<text x="580" y="132" text-anchor="middle" font-size="12" fill="#949eb2">str 对象</text>
<text x="24" y="196" font-size="12" fill="#949eb2">变量 a 里存的是地址，不是 "python" 本身；箭头表示引用，把名字和对象连起来。</text>
<text x="24" y="216" font-size="12" fill="#949eb2">这条线随时可以改指别处，变量名换一张标签，对象不受影响。</text>
</g>
</svg>
