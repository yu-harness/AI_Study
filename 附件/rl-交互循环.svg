<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" role="img" aria-labelledby="rl-loop-title rl-loop-desc">
<title id="rl-loop-title">强化学习的交互循环</title>
<desc id="rl-loop-desc">策略网络给出动作，环境返回新状态和奖励，循环往复形成轨迹。</desc>
<defs>
<marker id="rl-loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L8 5 L1 9" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="250" fill="#2d3142"/>
<text x="360" y="28" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f5f5f5">强化学习交互循环：模型做事，环境打分</text>
<rect x="50" y="60" width="220" height="84" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="160" y="88" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">策略网络 π（被训练的模型）</text>
<text x="160" y="112" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">观察状态，输出动作分布</text>
<rect x="450" y="60" width="220" height="84" rx="6" fill="#403A44" stroke="#f08a59" stroke-width="1"/>
<text x="560" y="88" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f08a59">环境</text>
<text x="560" y="112" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">收到动作后换状态、给分数</text>
<path d="M276 84 L444 84" stroke="#bfc0c0" stroke-width="1" marker-end="url(#rl-loop-arrow)"/>
<text x="360" y="74" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#bfc0c0">① 动作 a</text>
<path d="M444 120 L276 120" stroke="#bfc0c0" stroke-width="1" marker-end="url(#rl-loop-arrow)"/>
<text x="360" y="140" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#bfc0c0">② 新状态 s′ + 奖励 r</text>
<text x="360" y="186" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#bfc0c0">以文本生成为例：状态 = 已经写出的文字，动作 = 下一个 token，奖励 = 整句话末尾得到的打分。</text>
<text x="360" y="214" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#949eb2">这个循环一步步重复，就跑出一条完整的轨迹。</text>
</svg>
