<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relu-title relu-desc" id="ReLU-root">
        <title id="relu-title">ReLU 激活函数图像</title>
        <desc id="relu-desc">ReLU 在 x 小于 0 时输出恒为 0，在 x 大于 0 时输出等于 x，两段在原点相接，整条曲线只有一处折点。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ReLU-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Sans SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ReLU-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ReLU-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ReLU-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="ReLU-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#bfc0c0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <line x1="64" y1="352" x2="776" y2="352" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ReLU-arrow)"/>
        <line x1="416" y1="432" x2="416" y2="24" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ReLU-arrow)"/>

        <line x1="64" y1="346" x2="64" y2="358" stroke="#bfc0c0" stroke-width="1.2"/>
        <line x1="240" y1="346" x2="240" y2="358" stroke="#bfc0c0" stroke-width="1.2"/>
        <line x1="592" y1="346" x2="592" y2="358" stroke="#bfc0c0" stroke-width="1.2"/>
        <line x1="768" y1="346" x2="768" y2="358" stroke="#bfc0c0" stroke-width="1.2"/>

        <line x1="410" y1="272" x2="422" y2="272" stroke="#bfc0c0" stroke-width="1.2"/>
        <line x1="410" y1="192" x2="422" y2="192" stroke="#bfc0c0" stroke-width="1.2"/>
        <line x1="410" y1="112" x2="422" y2="112" stroke="#bfc0c0" stroke-width="1.2"/>
        <line x1="410" y1="32" x2="422" y2="32" stroke="#bfc0c0" stroke-width="1.2"/>

        <text x="64" y="382" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">-4</text>
        <text x="240" y="382" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">-2</text>
        <text x="592" y="382" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
        <text x="768" y="382" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>

        <text x="400" y="276" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end">1</text>
        <text x="400" y="196" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end">2</text>
        <text x="400" y="116" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end">3</text>
        <text x="400" y="36" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end">4</text>

        <polyline points="64,352 416,352 768,32" fill="none" stroke="#f08a59" stroke-width="3" stroke-linejoin="miter"/>
        <circle cx="416" cy="352" r="6" fill="#f08a59" stroke="#2d3142" stroke-width="2.5"/>

        <text x="96" y="88" fill="#f5f5f5" font-size="17" font-family="'Geist Mono', monospace">f(x) = max(0, x)</text>

        <text x="240" y="312" fill="#f5f5f5" font-size="15" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">x &lt; 0　输出恒为 0　斜率 0</text>

        <text x="474" y="192" fill="#f5f5f5" font-size="15" font-family="'Geist', 'Noto Sans SC', sans-serif">x &gt; 0　输出等于 x　斜率 1</text>

        <text x="444" y="392" fill="#f08a59" font-size="13" font-family="'Geist', 'Noto Sans SC', sans-serif">折点 (0, 0)</text>
      </svg>
