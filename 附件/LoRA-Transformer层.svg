<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 546" width="100%" role="img" aria-labelledby="tf-title tf-desc">
<title id="tf-title">Transformer 的一层与 LoRA 的位置</title>
<desc id="tf-desc">每层由自注意力与前馈网络组成，自注意力含四个投影，前馈网络含两个线性层；LoRA 默认加在 Wq 与 Wv 上。</desc>
<defs>
<marker id="tf-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L8 5 L1 9" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="546" fill="#2d3142"/>
<g font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="42" font-size="13" font-weight="600" fill="#f5f5f5">一层 Transformer 的内部</text>
<text x="500" y="42" font-size="13" font-weight="600" fill="#f5f5f5">堆叠 N 层</text>
<rect x="70" y="64" width="220" height="32" rx="4" fill="#2A3844" stroke="#7FA3C0" stroke-width="1"/>
<text x="180" y="85" text-anchor="middle" font-size="12" fill="#f5f5f5">输入（上一层输出 / 词向量）</text>
<path d="M180 96 L180 112" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#tf-arrow)"/>
<rect x="40" y="116" width="280" height="116" rx="6" fill="#2d3142" stroke="#7FA3C0" stroke-width="1"/>
<text x="54" y="140" font-size="12" font-weight="600" fill="#7FA3C0">自注意力 Self-Attention</text>
<rect x="56" y="152" width="52" height="42" rx="4" fill="#403A44" stroke="#f08a59" stroke-width="1.5"/>
<text x="82" y="178" text-anchor="middle" font-size="13" fill="#f08a59">Wq</text>
<rect x="126" y="152" width="52" height="42" rx="4" fill="#403A44" stroke="#f08a59" stroke-width="1" stroke-dasharray="4,3"/>
<text x="152" y="178" text-anchor="middle" font-size="13" fill="#f08a59">Wk</text>
<rect x="196" y="152" width="52" height="42" rx="4" fill="#403A44" stroke="#f08a59" stroke-width="1.5"/>
<text x="222" y="178" text-anchor="middle" font-size="13" fill="#f08a59">Wv</text>
<rect x="266" y="152" width="52" height="42" rx="4" fill="#403A44" stroke="#f08a59" stroke-width="1" stroke-dasharray="4,3"/>
<text x="292" y="178" text-anchor="middle" font-size="13" fill="#f08a59">Wo</text>
<text x="54" y="216" font-size="11" fill="#949eb2">四个投影：查询、键、值、输出</text>
<path d="M180 232 L180 248" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#tf-arrow)"/>
<circle cx="180" cy="262" r="12" fill="#2d3142" stroke="#bfc0c0" stroke-width="1.2"/>
<text x="180" y="267" text-anchor="middle" font-size="13" fill="#bfc0c0">＋</text>
<path d="M290 80 L344 80 L344 262 L194 262" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#tf-arrow)"/>
<text x="350" y="252" font-size="11" fill="#949eb2">残差</text>
<path d="M180 274 L180 296" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#tf-arrow)"/>
<rect x="40" y="300" width="280" height="100" rx="6" fill="#2d3142" stroke="#949eb2" stroke-width="1"/>
<text x="54" y="324" font-size="12" font-weight="600" fill="#f5f5f5">前馈网络 FFN</text>
<rect x="56" y="336" width="120" height="42" rx="4" fill="#403A44" stroke="#f08a59" stroke-width="1" stroke-dasharray="4,3"/>
<text x="116" y="362" text-anchor="middle" font-size="13" fill="#f08a59">W1（升维）</text>
<rect x="196" y="336" width="120" height="42" rx="4" fill="#403A44" stroke="#f08a59" stroke-width="1" stroke-dasharray="4,3"/>
<text x="256" y="362" text-anchor="middle" font-size="13" fill="#f08a59">W2（降维）</text>
<path d="M180 400 L180 416" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#tf-arrow)"/>
<circle cx="180" cy="430" r="12" fill="#2d3142" stroke="#bfc0c0" stroke-width="1.2"/>
<text x="180" y="435" text-anchor="middle" font-size="13" fill="#bfc0c0">＋</text>
<path d="M180 290 L366 290 L366 430 L194 430" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#tf-arrow)"/>
<text x="372" y="420" font-size="11" fill="#949eb2">残差</text>
<path d="M180 442 L180 460" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#tf-arrow)"/>
<rect x="70" y="462" width="220" height="32" rx="4" fill="#2A3844" stroke="#7FA3C0" stroke-width="1"/>
<text x="180" y="483" text-anchor="middle" font-size="12" fill="#f5f5f5">输出（送入下一层）</text>
<rect x="500" y="60" width="180" height="330" rx="6" fill="#2d3142" stroke="#5B6070" stroke-width="1"/>
<rect x="520" y="80" width="140" height="62" rx="4" fill="#3F4353" stroke="#949eb2" stroke-width="1"/>
<text x="590" y="106" text-anchor="middle" font-size="12" fill="#f5f5f5">第 N 层</text>
<text x="590" y="126" text-anchor="middle" font-size="11" fill="#949eb2">注意力 + FFN</text>
<text x="590" y="170" text-anchor="middle" font-size="13" fill="#949eb2">⋮</text>
<rect x="520" y="190" width="140" height="62" rx="4" fill="#3F4353" stroke="#949eb2" stroke-width="1"/>
<text x="590" y="216" text-anchor="middle" font-size="12" fill="#f5f5f5">第 2 层</text>
<text x="590" y="236" text-anchor="middle" font-size="11" fill="#949eb2">注意力 + FFN</text>
<text x="590" y="280" text-anchor="middle" font-size="13" fill="#949eb2">⋮</text>
<rect x="520" y="300" width="140" height="62" rx="4" fill="#3F4353" stroke="#949eb2" stroke-width="1"/>
<text x="590" y="326" text-anchor="middle" font-size="12" fill="#f5f5f5">第 1 层</text>
<text x="590" y="346" text-anchor="middle" font-size="11" fill="#949eb2">注意力 + FFN</text>
<text x="500" y="416" font-size="11" fill="#949eb2">每一层内部都是左边这套结构，</text>
<text x="500" y="434" font-size="11" fill="#949eb2">LoRA 只改其中几个权重矩阵。</text>
<text x="40" y="518" font-size="12" fill="#949eb2">橙色实线 = 默认加 LoRA（Wq、Wv）；橙色虚线 = 可选（Wk、Wo、FFN 的两个线性层）；</text>
<text x="40" y="538" font-size="12" fill="#949eb2">嵌入层与 LayerNorm 保持冻结。</text>
</g>
</svg>
