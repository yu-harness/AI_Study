<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-labelledby="mhead-title mhead-desc">
<title id="mhead-title">最后一维分成多个头</title>
<desc id="mhead-desc">12 维的向量按 4 维一组分成 3 组，形状从 5 × 512 × 12 变成 5 × 3 × 512 × 4，数字总数不变。</desc>
<defs>
<marker id="mhead-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L8 5 L1 9" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="340" fill="#2d3142"/>
<g font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<text x="368" y="62" text-anchor="middle" font-size="12" fill="#949eb2">一个 token 的向量：embedding = 12 维</text>
<path d="M80 74 L652 74" fill="none" stroke="#bfc0c0" stroke-width="1"/>
<path d="M80 68 L80 80" fill="none" stroke="#bfc0c0" stroke-width="1"/>
<path d="M652 68 L652 80" fill="none" stroke="#bfc0c0" stroke-width="1"/>
<g fill="#3F4353" stroke="#7FA3C0" stroke-width="1">
<rect x="80" y="90" width="44" height="36"/>
<rect x="128" y="90" width="44" height="36"/>
<rect x="176" y="90" width="44" height="36"/>
<rect x="224" y="90" width="44" height="36"/>
</g>
<g fill="#2C3A33" stroke="#86B39A" stroke-width="1">
<rect x="272" y="90" width="44" height="36"/>
<rect x="320" y="90" width="44" height="36"/>
<rect x="368" y="90" width="44" height="36"/>
<rect x="416" y="90" width="44" height="36"/>
</g>
<g fill="#403A44" stroke="#f08a59" stroke-width="1">
<rect x="464" y="90" width="44" height="36"/>
<rect x="512" y="90" width="44" height="36"/>
<rect x="560" y="90" width="44" height="36"/>
<rect x="608" y="90" width="44" height="36"/>
</g>
<path d="M80 146 L268 146" fill="none" stroke="#7FA3C0" stroke-width="1"/>
<path d="M80 140 L80 152" fill="none" stroke="#7FA3C0" stroke-width="1"/>
<path d="M268 140 L268 152" fill="none" stroke="#7FA3C0" stroke-width="1"/>
<path d="M272 146 L460 146" fill="none" stroke="#86B39A" stroke-width="1"/>
<path d="M272 140 L272 152" fill="none" stroke="#86B39A" stroke-width="1"/>
<path d="M460 140 L460 152" fill="none" stroke="#86B39A" stroke-width="1"/>
<path d="M464 146 L652 146" fill="none" stroke="#f08a59" stroke-width="1"/>
<path d="M464 140 L464 152" fill="none" stroke="#f08a59" stroke-width="1"/>
<path d="M652 140 L652 152" fill="none" stroke="#f08a59" stroke-width="1"/>
<text x="174" y="170" text-anchor="middle" font-size="12" fill="#7FA3C0">头 1 · 4 维</text>
<text x="366" y="170" text-anchor="middle" font-size="12" fill="#86B39A">头 2 · 4 维</text>
<text x="558" y="170" text-anchor="middle" font-size="12" fill="#f08a59">头 3 · 4 维</text>
<path d="M368 188 L368 222" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#mhead-arrow)"/>
<text x="380" y="210" font-size="12" fill="#949eb2">按 4 维一组分开，一共 3 组</text>
<text x="360" y="250" text-anchor="middle" font-size="14" fill="#f5f5f5">5 × 512 × 12　→　5 × 3 × 512 × 4</text>
<text x="360" y="276" text-anchor="middle" font-size="12" fill="#949eb2">30720 个数字，一个没多、一个没少</text>
<text x="24" y="312" font-size="12" fill="#949eb2">多出来的 3 就是头数：12 被分成 3 组、每组 4 维，原来的 embedding 这一维换成了 head_num 与 head_dim 两维。</text>
</g>
</svg>
