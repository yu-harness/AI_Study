<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-labelledby="shallowdata-title shallowdata-desc">
<title id="shallowdata-title">浅拷贝前的原始数据</title>
<desc id="shallowdata-desc">a 与 b 是两个独立的列表对象，分别放在 0x11 与 0x22 两块内存里；data 这个列表的两格存的是这两个地址。</desc>
<defs>
<marker id="shallowdata-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L8 5 L1 9" fill="none" stroke="#f08a59" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="340" fill="#2d3142"/>
<g font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<text x="104" y="70" font-size="12" fill="#f08a59">0x11</text>
<text x="404" y="70" font-size="12" fill="#f08a59">0x22</text>
<text x="700" y="176" text-anchor="end" font-size="12" fill="#949eb2">两个独立的列表对象</text>
<rect x="36" y="84" width="48" height="32" rx="4" fill="#2A3844" stroke="#7FA3C0" stroke-width="1"/>
<text x="60" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">a</text>
<path d="M88 100 L100 100" fill="none" stroke="#f08a59" stroke-width="1.3" marker-end="url(#shallowdata-arrow)"/>
<rect x="104" y="80" width="200" height="60" rx="6" fill="#2C3A33" stroke="#86B39A" stroke-width="1"/>
<text x="204" y="106" text-anchor="middle" font-size="14" font-weight="500" fill="#f5f5f5">1, 2, 3</text>
<text x="204" y="126" text-anchor="middle" font-size="12" fill="#949eb2">list 对象</text>
<rect x="336" y="84" width="48" height="32" rx="4" fill="#2A3844" stroke="#7FA3C0" stroke-width="1"/>
<text x="360" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">b</text>
<path d="M388 100 L400 100" fill="none" stroke="#f08a59" stroke-width="1.3" marker-end="url(#shallowdata-arrow)"/>
<rect x="404" y="80" width="200" height="60" rx="6" fill="#2C3A33" stroke="#86B39A" stroke-width="1"/>
<text x="504" y="106" text-anchor="middle" font-size="14" font-weight="500" fill="#f5f5f5">11, 22, 33</text>
<text x="504" y="126" text-anchor="middle" font-size="12" fill="#949eb2">list 对象</text>
<path d="M204 206 L204 144" fill="none" stroke="#f08a59" stroke-width="1.3" marker-end="url(#shallowdata-arrow)"/>
<path d="M504 206 L504 144" fill="none" stroke="#f08a59" stroke-width="1.3" marker-end="url(#shallowdata-arrow)"/>
<rect x="104" y="210" width="500" height="60" rx="6" fill="#2A3844" stroke="#7FA3C0" stroke-width="1"/>
<line x1="354" y1="210" x2="354" y2="270" stroke="#2d3142" stroke-width="2"/>
<text x="229" y="240" text-anchor="middle" font-size="13" font-weight="500" fill="#f08a59">0x11</text>
<text x="229" y="258" text-anchor="middle" font-size="12" fill="#949eb2">第一格</text>
<text x="479" y="240" text-anchor="middle" font-size="13" font-weight="500" fill="#f08a59">0x22</text>
<text x="479" y="258" text-anchor="middle" font-size="12" fill="#949eb2">第二格</text>
<text x="104" y="292" font-size="12" fill="#949eb2">data = [a, b]，两格存的是地址，不是里面的数字</text>
<text x="24" y="320" font-size="12" fill="#949eb2">浅拷贝会新建一个 data2，两格里抄的还是 0x11 与 0x22，所以改 a 的内部，两边都看得见。</text>
</g>
</svg>
