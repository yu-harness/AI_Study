<text x="100" y="408" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">7.5B 参数、64 张卡，纵轴为每张卡的显存（GB）；三块的分段长度按各自的字节数折算。</text>
