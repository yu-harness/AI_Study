<title id="zerogb-title">四个阶段每张卡的显存占用</title>
<desc id="zerogb-desc">7.5B 参数、64 张卡下，Stage 0 每卡 120 GB，Stage 1 降到 31.4 GB，Stage 2 降到 16.6 GB，Stage 3 降到 1.9 GB。</desc>
