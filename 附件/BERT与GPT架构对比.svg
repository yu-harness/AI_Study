<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C8AA0"/>
    </marker>
  </defs>

  <style>
    .panel-b { fill:#F7FAFE; stroke:#C3D2E6; stroke-width:1.2; stroke-dasharray:5 4; }
    .panel-g { fill:#F6FBF9; stroke:#BFDCD6; stroke-width:1.2; stroke-dasharray:5 4; }
    .box-b   { fill:#E8F0FA; stroke:#4A7EBB; stroke-width:1.6; }
    .box-g   { fill:#E4F2EE; stroke:#2F8F83; stroke-width:1.6; }
    .box-w   { fill:#FFFFFF; stroke:#C2CCDA; stroke-width:1.2; }
    .t       { font-family:"Microsoft YaHei","PingFang SC",sans-serif; font-size:13.5px; fill:#1F2937; text-anchor:middle; }
    .ts      { font-family:"Microsoft YaHei","PingFang SC",sans-serif; font-size:11.5px; fill:#5B6675; text-anchor:middle; }
    .tt      { font-family:"Microsoft YaHei","PingFang SC",sans-serif; font-size:16px; font-weight:600; text-anchor:middle; }
    .tt-b    { fill:#2F5C8F; }
    .tt-g    { fill:#1F6B62; }
    .edge    { stroke:#7C8AA0; stroke-width:1.4; fill:none; marker-end:url(#ar); }
    .c1      { fill:#4A7EBB; stroke:#FFFFFF; stroke-width:1; }
    .c0      { fill:#FFFFFF; stroke:#D3DAE4; stroke-width:1; }
    .c1g     { fill:#2F8F83; stroke:#FFFFFF; stroke-width:1; }
    .lb      { font-family:"Microsoft YaHei","PingFang SC",sans-serif; font-size:12px; fill:#3B4656; }
  </style>

  <!-- ===== BERT 面板 ===== -->
  <rect class="panel-b" x="20" y="16" width="420" height="440" rx="10"/>
  <text class="tt tt-b" x="230" y="46">BERT · Encoder-Only</text>

  <rect class="box-w" x="80" y="66" width="300" height="40" rx="6"/>
  <text class="t" x="230" y="91">[CLS] 我 爱 你 的 猫 [SEP]</text>

  <line class="edge" x1="230" y1="106" x2="230" y2="121"/>

  <rect class="box-w" x="80" y="124" width="300" height="40" rx="6"/>
  <text class="t" x="230" y="149">Token Embedding + 位置编码</text>

  <line class="edge" x1="230" y1="164" x2="230" y2="179"/>

  <rect class="box-b" x="80" y="182" width="300" height="70" rx="6"/>
  <text class="t" x="230" y="213">N × Encoder Layer</text>
  <text class="ts" x="230" y="234">Multi-Head Attention（全可见）+ FFN</text>

  <line class="edge" x1="230" y1="252" x2="230" y2="267"/>

  <rect class="box-w" x="80" y="270" width="300" height="40" rx="6"/>
  <text class="t" x="230" y="295">(B, S, 3584) 每个位置的表示</text>

  <line class="edge" x1="230" y1="310" x2="230" y2="325"/>

  <rect class="box-w" x="80" y="328" width="300" height="62" rx="6"/>
  <text class="t" x="230" y="355">取 [CLS] → 分类 / 句向量</text>
  <text class="ts" x="230" y="375">各位置 → NER / 答案抽取</text>

  <text class="ts" x="230" y="418">训练目标：Masked LM（完形填空）</text>

  <!-- ===== GPT 面板 ===== -->
  <rect class="panel-g" x="460" y="16" width="420" height="440" rx="10"/>
  <text class="tt tt-g" x="670" y="46">GPT · Decoder-Only</text>

  <rect class="box-w" x="520" y="66" width="300" height="40" rx="6"/>
  <text class="t" x="670" y="91">&lt;|im_start|&gt; 我 爱 你 的</text>

  <line class="edge" x1="670" y1="106" x2="670" y2="121"/>

  <rect class="box-w" x="520" y="124" width="300" height="40" rx="6"/>
  <text class="t" x="670" y="149">Token Embedding + 位置编码</text>

  <line class="edge" x1="670" y1="164" x2="670" y2="179"/>

  <rect class="box-g" x="520" y="182" width="300" height="70" rx="6"/>
  <text class="t" x="670" y="213">N × Decoder Layer</text>
  <text class="ts" x="670" y="234">Masked Attention（因果）+ FFN</text>

  <line class="edge" x1="670" y1="252" x2="670" y2="267"/>

  <rect class="box-w" x="520" y="270" width="300" height="40" rx="6"/>
  <text class="t" x="670" y="295">(B, S, 3584) 每个位置的表示</text>

  <line class="edge" x1="670" y1="310" x2="670" y2="325"/>

  <rect class="box-w" x="520" y="328" width="300" height="62" rx="6"/>
  <text class="t" x="670" y="355">Linear → Softmax</text>
  <text class="ts" x="670" y="375">→ 下一个 token 的概率</text>

  <text class="ts" x="670" y="418">训练目标：Next Token Prediction（续写）</text>

  <!-- ===== 底部：掩码对比 ===== -->
  <rect class="box-w" x="20" y="472" width="860" height="152" rx="10"/>
  <text class="tt" x="450" y="498" fill="#1F2937">核心区别：Attention Mask —— 唯一的分叉点</text>

  <!-- BERT 全 1 矩阵 -->
  <g>
    <rect class="c1" x="90"  y="514" width="18" height="18"/>
    <rect class="c1" x="108" y="514" width="18" height="18"/>
    <rect class="c1" x="126" y="514" width="18" height="18"/>
    <rect class="c1" x="144" y="514" width="18" height="18"/>
    <rect class="c1" x="162" y="514" width="18" height="18"/>
    <rect class="c1" x="90"  y="532" width="18" height="18"/>
    <rect class="c1" x="108" y="532" width="18" height="18"/>
    <rect class="c1" x="126" y="532" width="18" height="18"/>
    <rect class="c1" x="144" y="532" width="18" height="18"/>
    <rect class="c1" x="162" y="532" width="18" height="18"/>
    <rect class="c1" x="90"  y="550" width="18" height="18"/>
    <rect class="c1" x="108" y="550" width="18" height="18"/>
    <rect class="c1" x="126" y="550" width="18" height="18"/>
    <rect class="c1" x="144" y="550" width="18" height="18"/>
    <rect class="c1" x="162" y="550" width="18" height="18"/>
    <rect class="c1" x="90"  y="568" width="18" height="18"/>
    <rect class="c1" x="108" y="568" width="18" height="18"/>
    <rect class="c1" x="126" y="568" width="18" height="18"/>
    <rect class="c1" x="144" y="568" width="18" height="18"/>
    <rect class="c1" x="162" y="568" width="18" height="18"/>
    <rect class="c1" x="90"  y="586" width="18" height="18"/>
    <rect class="c1" x="108" y="586" width="18" height="18"/>
    <rect class="c1" x="126" y="586" width="18" height="18"/>
    <rect class="c1" x="144" y="586" width="18" height="18"/>
    <rect class="c1" x="162" y="586" width="18" height="18"/>
  </g>
  <text class="lb" x="196" y="552">全 1：双向</text>
  <text class="lb" x="196" y="572" fill="#5B6675">任意 token 互相可见</text>

  <!-- GPT 下三角矩阵 -->
  <g>
    <rect class="c1g" x="520" y="514" width="18" height="18"/>
    <rect class="c0"  x="538" y="514" width="18" height="18"/>
    <rect class="c0"  x="556" y="514" width="18" height="18"/>
    <rect class="c0"  x="574" y="514" width="18" height="18"/>
    <rect class="c0"  x="592" y="514" width="18" height="18"/>

    <rect class="c1g" x="520" y="532" width="18" height="18"/>
    <rect class="c1g" x="538" y="532" width="18" height="18"/>
    <rect class="c0"  x="556" y="532" width="18" height="18"/>
    <rect class="c0"  x="574" y="532" width="18" height="18"/>
    <rect class="c0"  x="592" y="532" width="18" height="18"/>

    <rect class="c1g" x="520" y="550" width="18" height="18"/>
    <rect class="c1g" x="538" y="550" width="18" height="18"/>
    <rect class="c1g" x="556" y="550" width="18" height="18"/>
    <rect class="c0"  x="574" y="550" width="18" height="18"/>
    <rect class="c0"  x="592" y="550" width="18" height="18"/>

    <rect class="c1g" x="520" y="568" width="18" height="18"/>
    <rect class="c1g" x="538" y="568" width="18" height="18"/>
    <rect class="c1g" x="556" y="568" width="18" height="18"/>
    <rect class="c1g" x="574" y="568" width="18" height="18"/>
    <rect class="c0"  x="592" y="568" width="18" height="18"/>

    <rect class="c1g" x="520" y="586" width="18" height="18"/>
    <rect class="c1g" x="538" y="586" width="18" height="18"/>
    <rect class="c1g" x="556" y="586" width="18" height="18"/>
    <rect class="c1g" x="574" y="586" width="18" height="18"/>
    <rect class="c1g" x="592" y="586" width="18" height="18"/>
  </g>
  <text class="lb" x="626" y="552">下三角：因果</text>
  <text class="lb" x="626" y="572" fill="#5B6675">只能看见自己与左侧</text>
</svg>
