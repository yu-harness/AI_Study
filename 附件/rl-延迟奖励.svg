<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" role="img" aria-labelledby="rl-delay-title rl-delay-desc">
<title id="rl-delay-title">延迟奖励</title>
<desc id="rl-delay-desc">轨迹中间步骤奖励都是零，整条轨迹末尾才有分数，分数要分摊回每一步。</desc>
<defs>
<marker id="rl-delay-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1 L8 5 L1 9" fill="none" stroke="#949eb2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="760" height="250" fill="#2d3142"/>
<text x="380" y="28" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f5f5f5">延迟奖励：分数只在轨迹末尾出现一次</text>

<rect x="40" y="110" width="76" height="44" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="78" y="136" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#f5f5f5">a₁</text>
<rect x="146" y="110" width="76" height="44" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="184" y="136" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#f5f5f5">a₂</text>
<rect x="252" y="110" width="76" height="44" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="290" y="136" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#f5f5f5">a₃</text>
<rect x="358" y="110" width="76" height="44" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="396" y="136" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#f5f5f5">a₄</text>
<rect x="464" y="110" width="76" height="44" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="502" y="136" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#f5f5f5">a₅</text>
<rect x="570" y="104" width="150" height="56" rx="6" fill="#403A44" stroke="#f08a59" stroke-width="1"/>
<text x="645" y="126" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#f08a59">整句回复写完了</text>
<text x="645" y="148" text-anchor="middle" font-family="'Geist',sans-serif" font-size="13" font-weight="600" fill="#f08a59">r = +10</text>
<text x="78" y="176" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#949eb2">r=0</text>
<text x="184" y="176" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#949eb2">r=0</text>
<text x="290" y="176" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#949eb2">r=0</text>
<text x="396" y="176" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#949eb2">r=0</text>
<text x="502" y="176" text-anchor="middle" font-family="'Geist',sans-serif" font-size="12" fill="#949eb2">r=0</text>
<path d="M560 84 C420 40 240 44 90 100" fill="none" stroke="#949eb2" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#rl-delay-arrow)"/>
<text x="330" y="62" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#bfc0c0">这 10 分该记在哪几步头上？</text>
<text x="380" y="212" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">梯度要分到每一步动作上，可分数只有末尾这一个——这就是"功劳分配"问题，PPO 笔记第九节的 GAE 解决的就是它。</text>
</svg>
