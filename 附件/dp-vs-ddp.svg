<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" role="img" aria-labelledby="dpddp-title dpddp-desc">
<title id="dpddp-title">DP 的中心汇总与 DDP 的环形交换</title>
<desc id="dpddp-desc">左边 DP 每张卡把梯度送给 0 号卡，0 号卡更新后再广播参数；右边 DDP 四张卡围成一环，各自与邻居交换梯度，没有中心节点。</desc>
<defs>
<marker id="dpddp-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L8 5 L1 9" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="320" fill="#2d3142"/>
<text x="24" y="48" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">DP：全部汇到 0 号卡</text>
<text x="392" y="48" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">DDP：环形交换</text>
<line x1="170" y1="104" x2="170" y2="136" stroke="#bfc0c0" stroke-width="1" marker-start="url(#dpddp-arrow)" marker-end="url(#dpddp-arrow)"/>
<line x1="170" y1="216" x2="170" y2="184" stroke="#bfc0c0" stroke-width="1" marker-start="url(#dpddp-arrow)" marker-end="url(#dpddp-arrow)"/>
<line x1="246" y1="160" x2="194" y2="160" stroke="#bfc0c0" stroke-width="1" marker-start="url(#dpddp-arrow)" marker-end="url(#dpddp-arrow)"/>
<line x1="114" y1="160" x2="146" y2="160" stroke="#bfc0c0" stroke-width="1" marker-start="url(#dpddp-arrow)" marker-end="url(#dpddp-arrow)"/>
<circle cx="170" cy="160" r="24" fill="#403A44" stroke="#f08a59" stroke-width="1"/>
<text x="170" y="165" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f08a59">0</text>
<circle cx="170" cy="84" r="20" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="170" y="89" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">1</text>
<circle cx="246" cy="160" r="20" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="246" y="165" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">2</text>
<circle cx="170" cy="236" r="20" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="170" y="241" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">3</text>
<circle cx="94" cy="160" r="20" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="94" y="165" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">4</text>
<circle cx="500" cy="160" r="76" fill="none" stroke="#949eb2" stroke-width="1" stroke-dasharray="4,4"/>
<path d="M562.2 205.2 L545.2 222.2" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpddp-arrow)"/>
<path d="M454.8 222.2 L437.8 205.2" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpddp-arrow)"/>
<path d="M437.8 114.8 L454.8 97.8" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpddp-arrow)"/>
<path d="M545.2 97.8 L562.2 114.8" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#dpddp-arrow)"/>
<circle cx="500" cy="84" r="20" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="500" y="89" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">0</text>
<circle cx="576" cy="160" r="20" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="576" y="165" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">1</text>
<circle cx="500" cy="236" r="20" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="500" y="241" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">2</text>
<circle cx="424" cy="160" r="20" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
<text x="424" y="165" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">3</text>
<text x="24" y="292" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#949eb2">DP 的 0 号卡要收齐全部梯度、再广播全部参数，两头都是它一个人扛；DDP 每张卡只和左右邻居收发。</text>
</svg>
