<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="100%" role="img" aria-labelledby="argmax-table-title argmax-table-desc">
<title id="argmax-table-title">argmax 贪心搜索示例</title>
<desc id="argmax-table-desc">四个时间步上 A、B、C、eos 的条件概率，贪心每步取最大，得到 A 到 B 到 C 到 eos，整句概率 0.048。</desc>
<rect x="0" y="0" width="680" height="330" fill="#2d3142"/>
<g font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="32" font-size="13" fill="#f5f5f5">argmax：每一步取概率最大的 token</text>
<text x="92" y="81" font-size="12" fill="#949eb2" text-anchor="end">时间步</text>
<text x="144" y="81" font-size="12" fill="#bfc0c0" text-anchor="middle">1</text>
<text x="232" y="81" font-size="12" fill="#bfc0c0" text-anchor="middle">2</text>
<text x="320" y="81" font-size="12" fill="#bfc0c0" text-anchor="middle">3</text>
<text x="408" y="81" font-size="12" fill="#bfc0c0" text-anchor="middle">4</text>
<text x="92" y="120" font-size="12" fill="#bfc0c0" text-anchor="end">A</text>
<rect x="100" y="98" width="88" height="44" fill="#403A44" stroke="#f08a59" stroke-width="1.5"/>
<text x="144" y="120" font-size="13" fill="#f08a59" text-anchor="middle">0.5</text>
<rect x="188" y="98" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="232" y="120" font-size="12" fill="#949eb2" text-anchor="middle">0.1</text>
<rect x="276" y="98" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="320" y="120" font-size="12" fill="#949eb2" text-anchor="middle">0.2</text>
<rect x="364" y="98" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="408" y="120" font-size="12" fill="#949eb2" text-anchor="middle">0.0</text>
<text x="92" y="164" font-size="12" fill="#bfc0c0" text-anchor="end">B</text>
<rect x="100" y="142" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="144" y="164" font-size="12" fill="#949eb2" text-anchor="middle">0.2</text>
<rect x="188" y="142" width="88" height="44" fill="#403A44" stroke="#f08a59" stroke-width="1.5"/>
<text x="232" y="164" font-size="13" fill="#f08a59" text-anchor="middle">0.4</text>
<rect x="276" y="142" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="320" y="164" font-size="12" fill="#949eb2" text-anchor="middle">0.2</text>
<rect x="364" y="142" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="408" y="164" font-size="12" fill="#949eb2" text-anchor="middle">0.2</text>
<text x="92" y="208" font-size="12" fill="#bfc0c0" text-anchor="end">C</text>
<rect x="100" y="186" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="144" y="208" font-size="12" fill="#949eb2" text-anchor="middle">0.2</text>
<rect x="188" y="186" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="232" y="208" font-size="12" fill="#949eb2" text-anchor="middle">0.3</text>
<rect x="276" y="186" width="88" height="44" fill="#403A44" stroke="#f08a59" stroke-width="1.5"/>
<text x="320" y="208" font-size="13" fill="#f08a59" text-anchor="middle">0.4</text>
<rect x="364" y="186" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="408" y="208" font-size="12" fill="#949eb2" text-anchor="middle">0.2</text>
<text x="92" y="252" font-size="12" fill="#bfc0c0" text-anchor="end">&lt;eos&gt;</text>
<rect x="100" y="230" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="144" y="252" font-size="12" fill="#949eb2" text-anchor="middle">0.1</text>
<rect x="188" y="230" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="232" y="252" font-size="12" fill="#949eb2" text-anchor="middle">0.2</text>
<rect x="276" y="230" width="88" height="44" fill="#3F4353" stroke="#5B6070" stroke-width="1"/>
<text x="320" y="252" font-size="12" fill="#949eb2" text-anchor="middle">0.2</text>
<rect x="364" y="230" width="88" height="44" fill="#403A44" stroke="#f08a59" stroke-width="1.5"/>
<text x="408" y="252" font-size="13" fill="#f08a59" text-anchor="middle">0.6</text>
<text x="476" y="112" font-size="12" fill="#bfc0c0">贪心路径</text>
<text x="476" y="136" font-size="13" fill="#f08a59">A → B → C → eos</text>
<text x="476" y="176" font-size="12" fill="#bfc0c0">整句概率</text>
<text x="476" y="200" font-size="12" fill="#949eb2">0.5 × 0.4 × 0.4 × 0.6</text>
<text x="476" y="224" font-size="13" fill="#f08a59">= 0.048</text>
<text x="476" y="266" font-size="12" fill="#949eb2">每列各取一次最大，</text>
<text x="476" y="286" font-size="12" fill="#949eb2">不回头看整句</text>
</g>
</svg>
