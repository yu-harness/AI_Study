<rect x="210" y="68" width="450" height="44" fill="#f08a59" stroke="#2d3142" stroke-width="1"/>
<text x="97" y="96" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">2 B</text>
<text x="172" y="96" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">2 B</text>
<text x="435" y="96" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#2d3142">12 B</text>
