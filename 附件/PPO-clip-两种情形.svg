<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="100%" role="img" aria-labelledby="ppo-clip-title ppo-clip-desc">
<title id="ppo-clip-title">PPO-clip 目标函数曲线</title>
<desc id="ppo-clip-desc">A 为正时截断发生在 r 大于 1+ε 一侧，A 为负时截断发生在 r 小于 1−ε 一侧，出界区间内目标函数为常数，梯度为 0。</desc>
<rect x="0" y="0" width="760" height="410" fill="#2d3142"/>
<text x="380" y="28" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f5f5f5">PPO-clip 目标函数 L(r) 随概率比率 r 的变化（ε = 0.2，A 取 ±2）</text>

<!-- 左图标题 -->
<text x="210" y="56" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">A = +2：好动作，鼓励推高</text>
<text x="210" y="74" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#bfc0c0">截断只发生在 r &gt; 1+ε 一侧</text>
<!-- 右图标题 -->
<text x="575" y="56" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">A = −2：坏动作，压低概率</text>
<text x="575" y="74" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#bfc0c0">截断只发生在 r &lt; 1−ε 一侧</text>

<!-- 左图坐标系 -->
<path d="M60 300 L356 300" stroke="#4a4f63" stroke-width="1"/>
<path d="M206 300 L206 140" stroke="#4a4f63" stroke-width="0.8" stroke-dasharray="4,4"/>
<path d="M274 300 L274 140" stroke="#4a4f63" stroke-width="0.8" stroke-dasharray="4,4"/>
<text x="206" y="318" text-anchor="middle" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">1−ε</text>
<text x="240" y="318" text-anchor="middle" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">1</text>
<text x="274" y="318" text-anchor="middle" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">1+ε</text>
<text x="352" y="318" text-anchor="middle" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">r</text>
<text x="76" y="120" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">L(r)</text>
<!-- 左图：未截断 rA -->
<path d="M70 300 L350 113" stroke="#949eb2" stroke-width="1" stroke-dasharray="5,4" fill="none"/>
<!-- 左图：截断目标 min(rA, clip(r)A) -->
<path d="M70 300 L274 168 L350 168" stroke="#f08a59" stroke-width="2.5" fill="none"/>
<text x="283" y="192" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#949eb2">梯度为 0</text>

<!-- 右图坐标系 -->
<path d="M420 170 L726 170" stroke="#4a4f63" stroke-width="1"/>
<path d="M566 170 L566 345" stroke="#4a4f63" stroke-width="0.8" stroke-dasharray="4,4"/>
<path d="M634 170 L634 345" stroke="#4a4f63" stroke-width="0.8" stroke-dasharray="4,4"/>
<text x="566" y="358" text-anchor="middle" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">1−ε</text>
<text x="600" y="358" text-anchor="middle" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">1</text>
<text x="634" y="358" text-anchor="middle" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">1+ε</text>
<text x="722" y="184" text-anchor="middle" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">r</text>
<text x="426" y="162" font-family="'Geist',sans-serif" font-size="11" fill="#bfc0c0">L(r)</text>
<!-- 右图：未截断 rA -->
<path d="M430 170 L719 340" stroke="#949eb2" stroke-width="1" stroke-dasharray="5,4" fill="none"/>
<!-- 右图：截断目标 -->
<path d="M430 250 L566 250 L719 340" stroke="#f08a59" stroke-width="2.5" fill="none"/>
<text x="440" y="286" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#949eb2">梯度为 0，压低到此为止</text>

<!-- 图例 -->
<path d="M150 388 L186 388" stroke="#f08a59" stroke-width="2.5"/>
<text x="192" y="392" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#bfc0c0">L = min(r·A, clip(r)·A)</text>
<path d="M430 388 L466 388" stroke="#949eb2" stroke-width="1" stroke-dasharray="5,4"/>
<text x="472" y="392" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#bfc0c0">未截断的 r·A</text>
</svg>
