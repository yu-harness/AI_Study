# Strict local runtime. Agent inference stays on the user-selected Ollama model;
# retrieval, cache, and entity linking use their real backing services.

runtime:
  start_metadata_scheduler: true

llm:
  planner:
    provider: "ollama"
    model: "qwen3.5:4b"
    base_url: "http://127.0.0.1:8000"
    max_parallel: 1
    temperature: 0.1
    top_p: 0.9
    max_tokens: 2048
    think: false
    timeout: 240
    keep_alive: "10m"
  coder:
    provider: "ollama"
    model: "qwen3.5:4b"
    base_url: "http://127.0.0.1:8000"
    max_parallel: 3
    temperature: 0.7
    retry_temperature: 0.2
    top_p: 0.9
    max_tokens: 1024
    think: false
    stop: ["</s>"]
    timeout: 240
    keep_alive: "10m"
  judge: null

embedding:
  provider: "ollama"
  model: "bge-m3:latest"
  base_url: "http://127.0.0.1:8000"
  timeout: 60

database:
  targets:
    docker_postgres:
      url: "postgresql+psycopg2://text2sql_readonly:text2sql_readonly@127.0.0.1:55432/text2sql"
      metadata_url: "postgresql+psycopg2://text2sql_readonly:text2sql_readonly@127.0.0.1:55432/text2sql"
      pool_size: 5
      max_overflow: 10
      query_timeout: 10
    local_sqlite:
      url: "sqlite:///./data/sandbox.sqlite"
      metadata_url: "sqlite:///./data/sandbox.sqlite"
      pool_size: 5
      max_overflow: 0
      query_timeout: 5
  cache:
    redis_url: "redis://127.0.0.1:6379/0"
    ttl: 86400

retrieval:
  business_kb_enabled: true
  similarity_threshold: 0.95
  business_kb_top_k: 3
  business_kb_min_score: 0.2
  table_top_k: 10
  column_top_k: 20
  table_min_score: 0.0
  column_min_score: 0.0
  bloodline_max_hops: 2
  bloodline_max_tables: 12

elasticsearch:
  hosts: ["http://127.0.0.1:9200"]
  entity_index: "text2sql_entity_index"
  analyzer: "ik_max_word"

router:
  router_index_path: "db_router_index"
  db_descriptors: "./configs/db_descriptors.json"
  default_target_db: "docker_postgres"
  default_dialect: "postgresql"
  default_dialect_rules:
    - "Use PostgreSQL syntax."
    - "Use LIMIT for row limits."
    - "Use date strings in YYYY-MM-DD format."

agent:
  max_retries: 3
  max_candidates: 3
  result_limit: 100
  cost_threshold_rows: 10000000
  fallback_enabled: true
  semantic_cache_enabled: true

paths:
  business_knowledge: "./business_knowledge"
