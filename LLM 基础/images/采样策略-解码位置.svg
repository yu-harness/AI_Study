<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="解码策略在生成链路中的位置">
    <defs>
      <marker id="ars1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa39c" />
      </marker>
      <marker id="ars1w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#b06a2c" />
      </marker>
    </defs>

    <rect x="0" y="24" width="120" height="54" rx="6" fill="#faf4e9" stroke="#dbd1be" />
    <text x="60" y="47" text-anchor="middle" font-size="12.5" fill="#2e2a23">已有 token</text>
    <text x="60" y="66" text-anchor="middle" font-size="11" fill="#968c7f">上文</text>

    <rect x="145" y="24" width="120" height="54" rx="6" fill="#faf4e9" stroke="#dbd1be" />
    <text x="205" y="56" text-anchor="middle" font-size="12.5" fill="#2e2a23">Embedding</text>

    <rect x="290" y="24" width="150" height="54" rx="6" fill="#faf4e9" stroke="#dbd1be" />
    <text x="365" y="47" text-anchor="middle" font-size="12.5" fill="#2e2a23">Transformer</text>
    <text x="365" y="66" text-anchor="middle" font-size="11" fill="#968c7f">N 层自注意力</text>

    <rect x="464" y="24" width="130" height="54" rx="6" fill="#faf4e9" stroke="#dbd1be" />
    <text x="529" y="47" text-anchor="middle" font-size="12.5" fill="#2e2a23">lm_head</text>
    <text x="529" y="66" text-anchor="middle" font-size="11" fill="#968c7f">Linear 投影</text>

    <rect x="618" y="24" width="130" height="54" rx="6" fill="#e6efe4" stroke="#2c6a57" />
    <text x="683" y="47" text-anchor="middle" font-size="12.5" fill="#2c6a57">logits</text>
    <text x="683" y="66" text-anchor="middle" font-size="11" fill="#4f7d6c">词表 V 维</text>

    <line x1="120" y1="51" x2="139" y2="51" stroke="#9aa39c" stroke-width="1.4" marker-end="url(#ars1)" />
    <line x1="265" y1="51" x2="284" y2="51" stroke="#9aa39c" stroke-width="1.4" marker-end="url(#ars1)" />
    <line x1="440" y1="51" x2="458" y2="51" stroke="#9aa39c" stroke-width="1.4" marker-end="url(#ars1)" />
    <line x1="594" y1="51" x2="612" y2="51" stroke="#9aa39c" stroke-width="1.4" marker-end="url(#ars1)" />

    <path d="M 683 78 L 683 112 L 475 112 L 475 162" fill="none" stroke="#b06a2c" stroke-width="1.4" marker-end="url(#ars1w)" />
    <text x="695" y="106" font-size="11.5" fill="#96602a">到这里都是模型算的</text>

    <rect x="380" y="168" width="190" height="56" rx="6" fill="#fdf6ec" stroke="#b06a2c" />
    <text x="475" y="192" text-anchor="middle" font-size="12.5" fill="#96602a">解码策略</text>
    <text x="475" y="211" text-anchor="middle" font-size="11" fill="#a97a45">温度 · Top-K · Top-P</text>

    <rect x="600" y="168" width="140" height="56" rx="6" fill="#faf4e9" stroke="#dbd1be" />
    <text x="670" y="192" text-anchor="middle" font-size="12.5" fill="#2e2a23">选出一个 token</text>
    <text x="670" y="211" text-anchor="middle" font-size="11" fill="#968c7f">追加到末尾</text>

    <line x1="570" y1="196" x2="594" y2="196" stroke="#b06a2c" stroke-width="1.4" marker-end="url(#ars1w)" />

    <path d="M 670 224 L 670 262 L 60 262 L 60 84" fill="none" stroke="#9aa39c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ars1)" />
    <text x="300" y="256" font-size="11.5" fill="#968c7f">下一轮：新 token 拼进上文，重新喂给模型</text>
  </svg>