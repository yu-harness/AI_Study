<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Top-K 截断与重新归一化">
    <text x="150" y="30" text-anchor="middle" font-size="12.5" fill="#2e2a23">截断前：全部候选</text>
    <text x="560" y="30" text-anchor="middle" font-size="12.5" fill="#2e2a23">截断并重新归一化</text>

    <line x1="20" y1="220" x2="310" y2="220" stroke="#dbd1be" />
    <rect x="30" y="94" width="34" height="126" fill="#2c6a57" opacity=".85" />
    <rect x="76" y="144" width="34" height="76" fill="#2c6a57" opacity=".85" />
    <rect x="122" y="170" width="34" height="50" fill="#2c6a57" opacity=".85" />
    <rect x="168" y="206" width="34" height="14" fill="#c8bfae" />
    <rect x="214" y="212" width="34" height="8" fill="#c8bfae" />
    <rect x="260" y="214" width="34" height="6" fill="#c8bfae" />

    <line x1="160" y1="60" x2="160" y2="232" stroke="#b06a2c" stroke-width="1.3" stroke-dasharray="5 4" />
    <text x="166" y="56" font-size="11.5" fill="#96602a">K = 3</text>
    <text x="30" y="256" font-size="11.5" fill="#968c7f">后三个被丢掉，概率和约 0.10</text>

    <line x1="320" y1="160" x2="424" y2="160" stroke="#9aa39c" stroke-width="1.4" />
    <path d="M 424 160 L 416 156 L 416 164 Z" fill="#9aa39c" />
    <text x="338" y="150" font-size="11.5" fill="#968c7f">÷ 0.90</text>

    <line x1="440" y1="220" x2="700" y2="220" stroke="#dbd1be" />
    <rect x="450" y="80" width="34" height="140" fill="#2c6a57" opacity=".85" />
    <rect x="496" y="136" width="34" height="84" fill="#2c6a57" opacity=".85" />
    <rect x="542" y="164" width="34" height="56" fill="#2c6a57" opacity=".85" />

    <line x1="588" y1="216" x2="622" y2="216" stroke="#c8bfae" stroke-width="2" />
    <line x1="634" y1="216" x2="668" y2="216" stroke="#c8bfae" stroke-width="2" />

    <text x="450" y="256" font-size="11.5" fill="#968c7f">三个词按比例放大，总和回到 1</text>

    <text x="380" y="286" text-anchor="middle" font-size="12" fill="#2c6a57">顺序不变，只是把保留的那几个按比例放大</text>
  </svg>